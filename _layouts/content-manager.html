<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} &middot; {% endif %}{{ site.title | escape }}</title>
  {% if page.teaser %}<meta name="description" content="{{ page.teaser | strip_newlines | escape }}">{% endif %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23b08d57' d='M12 2c2.5 3 4 5.2 4 7.5a4 4 0 0 1-8 0C8 7.2 9.5 5 12 2Z'/%3E%3Crect x='10' y='15' width='4' height='7' rx='1' fill='%231c2230'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-serif: "Cormorant Garamond", ui-serif, Georgia, "Times New Roman", serif;
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

      --color-ivory: #fbf8f3;
      --color-parchment: #f3ece1;
      --color-ink: #1c2230;
      --color-ink-light: #2b3349;

      --color-gold-200: #ebdcc0;
      --color-gold-300: #dcc79e;
      --color-gold-400: #c9a96e;
      --color-gold-500: #b08d57;
      --color-gold-600: #8f6f3e;

      --animate-ripple: ripple 9s ease-in-out infinite;
      @keyframes ripple {
        0%, 100% { opacity: .55; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }
    }
  </style>
  <style>
    .js [data-reveal] { opacity: 0; transform: translateY(16px); transition: opacity 1s ease, transform 1s ease; }
    .js [data-reveal].is-visible { opacity: 1; transform: none; }
    details > summary::-webkit-details-marker { display: none; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .js [data-reveal] { opacity: 1; transform: none; transition: none; }
      .animate-ripple { animation: none; }
    }
  </style>
  <style>
.cm-page{max-width:44rem;margin:0 auto;padding:3.5rem 1.25rem 5rem}
.cm-header{margin-bottom:2.5rem}
.cm-header h1{font-size:clamp(2.25rem,6vw,3.25rem);line-height:1.1;font-weight:600;margin:0}
.cm-back{margin:0 0 1.5rem;font-size:.875rem}
.cm-back a{text-decoration:none;opacity:.75}
.cm-back a:hover{opacity:1}
.cm-meta{margin:.75rem 0 0;font-size:.8125rem;letter-spacing:.04em;opacity:.65}
.cm-hero{display:block;width:100%;height:auto;margin:0 0 2.5rem;border-radius:.75rem}
.cm-content{font-size:1.125rem;line-height:1.75}
.cm-content>*+*{margin-top:1.25em}
.cm-content h2{font-size:1.75rem;line-height:1.25;font-weight:600;margin-top:2em}
.cm-content h3{font-size:1.375rem;line-height:1.3;font-weight:600;margin-top:1.75em}
.cm-content a{text-decoration:underline}
.cm-content ul{list-style:disc;padding-left:1.5em}
.cm-content ol{list-style:decimal;padding-left:1.5em}
.cm-content blockquote{margin-left:0;padding-left:1.25em;border-left:3px solid currentColor;font-style:italic;opacity:.85}
.cm-content img{display:block;max-width:100%;height:auto;border-radius:.5rem}
.cm-content hr{border:0;border-top:1px solid color-mix(in srgb,currentColor 20%,transparent);margin:2.5em 0}
.cm-list{display:grid;gap:1rem}
.cm-card{display:block;padding:1.5rem;border:1px solid color-mix(in srgb,currentColor 15%,transparent);border-radius:.75rem;color:inherit;text-decoration:none;transition:border-color .15s}
.cm-card:hover{border-color:color-mix(in srgb,currentColor 45%,transparent)}
.cm-card h2{font-size:1.5rem;line-height:1.25;font-weight:600;margin:.5rem 0 0}
.cm-card p:not(.cm-meta){margin:.5rem 0 0;opacity:.8}
.cm-card .cm-meta{margin:0}
.cm-empty{opacity:.7}
.cm-verse{display:block;margin:0 0 2.5rem;padding:2rem;border:1px solid color-mix(in srgb,currentColor 15%,transparent);border-radius:1rem;color:inherit;text-decoration:none}
.cm-verse blockquote{margin:0;font-size:clamp(1.375rem,4vw,1.875rem);line-height:1.4}
.cm-verse figcaption{margin-top:1rem;font-weight:600}
.cm-poem{padding:2.5rem 0;border-top:1px solid color-mix(in srgb,currentColor 15%,transparent)}
.cm-poem h2{font-size:1.75rem;line-height:1.25;font-weight:600;margin:0}
.cm-poem-text{margin-top:1.5rem;font-size:1.125rem;line-height:1.75;white-space:pre-line}
  </style>
</head>
<body>
  <header data-header="" class="group/header fixed inset-x-0 top-0 z-50 transition-all duration-500 data-scrolled:bg-ivory/85 data-scrolled:shadow-[0_1px_0_rgba(28,34,48,0.06)] data-scrolled:backdrop-blur-md">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-6 transition-all duration-500 group-data-scrolled/header:py-4">
      <a href="#top" class="flex items-center gap-2.5">
        <svg viewBox="0 0 24 24" class="size-6" aria-hidden="true">
          <path fill="currentColor" class="text-gold-500" d="M12 2c2.5 3 4 5.2 4 7.5a4 4 0 0 1-8 0C8 7.2 9.5 5 12 2Z"></path>
          <rect x="10" y="15" width="4" height="7" rx="1" class="fill-ink"></rect>
        </svg>
        <span class="font-serif text-2xl font-medium tracking-wide">Still Waters</span>
      </a>

      <div class="hidden items-center gap-10 text-[12px] font-medium uppercase tracking-[0.2em] text-ink/65 md:flex">
        <a href="#today" class="transition hover:text-gold-600">Today</a>
        <a href="#rhythms" class="transition hover:text-gold-600">Rhythms</a>
        <a href="#prayers" class="transition hover:text-gold-600">Prayers</a>
        <a href="#wall" class="transition hover:text-gold-600">Prayer Wall</a>
      </div>

      <a href="#wall" class="hidden rounded-full border border-ink/15 px-5 py-2 text-sm font-medium transition hover:border-ink hover:bg-ink hover:text-ivory md:inline-flex">Share a request</a>

      <button type="button" data-menu-button="" aria-expanded="false" aria-controls="mobile-menu" class="-mr-2 rounded-full p-2 text-ink/80 transition hover:bg-ink/5 md:hidden">
        <span class="sr-only">Open menu</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="size-6" aria-hidden="true"><path stroke-linecap="round" d="M4 8h16M4 16h16"></path></svg>
      </button>
    </nav>

    <div id="mobile-menu" hidden="" class="border-t border-ink/5 bg-ivory/95 px-6 pb-6 backdrop-blur-md md:hidden">
      <div class="flex flex-col divide-y divide-ink/5 text-sm font-medium uppercase tracking-[0.18em] text-ink/70">
        <a href="#today" class="py-4">Today</a>
        <a href="#rhythms" class="py-4">Rhythms</a>
        <a href="#prayers" class="py-4">Prayers</a>
        <a href="#wall" class="py-4">Prayer Wall</a>
      </div>
    </div>
  </header>
  <main>{{ content }}</main>
  <footer class="border-t border-ink/10 px-6 py-12">
    <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-6 text-center md:flex-row md:text-left">
      <a href="#top" class="flex items-center gap-2.5">
        <svg viewBox="0 0 24 24" class="size-5" aria-hidden="true">
          <path fill="currentColor" class="text-gold-500" d="M12 2c2.5 3 4 5.2 4 7.5a4 4 0 0 1-8 0C8 7.2 9.5 5 12 2Z"></path>
          <rect x="10" y="15" width="4" height="7" rx="1" class="fill-ink"></rect>
        </svg>
        <span class="font-serif text-xl font-medium">Still Waters</span>
      </a>
      <p class="font-serif text-lg text-ink/55 italic">“He leadeth me beside the still waters. He restoreth my soul.”</p>
      <p class="text-xs uppercase tracking-[0.2em] text-ink/45">© <span id="year">2026</span> Still Waters</p>
    </div>
  </footer>
  
</body>
</html>
